<div class="floor" aria-hidden="true">
  <div class="plane" [style.background-image]="floorImage"></div>
</div>
<div class="sun" aria-hidden="true"></div>
<div class="gleam" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<main class="hero">
  <div class="lockup">
    <h1 class="wordmark" aria-label="parket">
      @for (letter of letters; track $index) {
        <span class="cell" aria-hidden="true" [style.--i]="$index" [style.--c]="$index - 2.5">
          <span class="letter">{{ letter }}</span>
        </span>
      }
      <span class="sheen" aria-hidden="true">parket</span>
    </h1>
    <span class="rule" aria-hidden="true"></span>
  </div>
  <div class="cta" [class.revealed]="ctaRevealed()" [class.has-summary]="summary !== null">
    <p class="kicker" aria-hidden="true">Herringbone, in 3D</p>
    @if (summary; as s) {
      <div class="actions">
        <a class="pill primary" routerLink="/designer">
          Continue: <span class="name">{{ s.activeName }}</span>
        </a>
        <a class="pill" routerLink="/designer" [queryParams]="{ new: 1 }">Design your floor</a>
      </div>
      <p class="meta">{{ projectCount }}</p>
    } @else {
      <a class="pill" routerLink="/designer">Design your floor</a>
    }
  </div>
</main>
<div class="grain" aria-hidden="true" [style.--grain-image]="grainImage"></div>
