<div class="scrim" (click)="onScrim()"></div>
<div
  #dialog
  class="dialog"
  tabindex="-1"
  role="dialog"
  aria-modal="true"
  aria-labelledby="projects-title"
  (click)="onPanelClick($event)"
>
  <header class="head">
    <h2 id="projects-title">Projects</h2>
    <button type="button" class="btn close" aria-label="Close" (click)="closed.emit()">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 4 12 12M12 4 4 12" />
      </svg>
    </button>
  </header>
  <p class="count">{{ count() }} of {{ max }} projects</p>
  <button
    type="button"
    class="btn primary new"
    data-new
    [attr.aria-disabled]="atLimit()"
    [attr.aria-describedby]="atLimit() ? 'projects-limit' : null"
    (click)="create()"
  >
    <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M8 3v10M3 8h10" />
    </svg>
    New project
  </button>
  @if (atLimit()) {
    <p id="projects-limit" class="hint">Limit reached. Delete a project to add more.</p>
  }
  <ul class="list" (scroll)="closeMenu(false)">
    @for (row of rows(); track row.id) {
      <li class="item-row" [class.current]="row.current">
        @if (renamingId() === row.id) {
          <div class="rename">
            <input
              #renameField
              class="field"
              type="text"
              aria-label="Project name"
              aria-describedby="project-name-help"
              enterkeyhint="done"
              autocomplete="off"
              [maxLength]="nameMax"
              [value]="row.name"
              (keydown.enter)="commitRename(row.id, renameField.value)"
              (blur)="commitRename(row.id, renameField.value)"
            />
            <small id="project-name-help">1 to 40 characters</small>
          </div>
        } @else {
          <button
            type="button"
            class="row"
            [attr.aria-current]="row.current ? 'true' : null"
            (click)="open(row.id)"
          >
            <span class="name">{{ row.name }}</span>
            &ngsp;
            <span class="meta">
              @if (row.current) {
                <svg class="icon check" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M3.5 8.5 6.5 11.5 12.5 4.5" />
                </svg>
              }
              <span>{{ row.edited }}</span>
              @if (row.current) {
                &ngsp;
                <span aria-hidden="true">&middot;</span>
                &ngsp;
                <span class="current-word">Current</span>
              }
            </span>
          </button>
        }
        <button
          type="button"
          class="btn more"
          [attr.data-more]="row.id"
          [attr.aria-label]="'More actions for ' + row.name"
          aria-haspopup="menu"
          [attr.aria-expanded]="menu()?.id === row.id"
          [attr.aria-controls]="menu()?.id === row.id ? 'projects-menu' : null"
          (click)="toggleMenu(row.id, $event)"
        >
          <svg class="icon dots" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="3" cy="8" r="1.1" />
            <circle cx="8" cy="8" r="1.1" />
            <circle cx="13" cy="8" r="1.1" />
          </svg>
        </button>
      </li>
    }
  </ul>
  @if (menu(); as open) {
    <div
      id="projects-menu"
      class="menu"
      role="menu"
      [attr.aria-label]="'Actions for ' + menuName()"
      [style.right.px]="open.right"
      [style.top.px]="open.top"
      (keydown)="onMenuKey($event)"
    >
      <button type="button" class="item" role="menuitem" (click)="startRename(open.id)">
        Rename
      </button>
      <button
        type="button"
        class="item"
        role="menuitem"
        [attr.aria-disabled]="atLimit()"
        (click)="duplicate(open.id)"
      >
        <span>Duplicate</span>
        @if (atLimit()) {
          <small>Limit reached</small>
        }
      </button>
      <button type="button" class="item danger" role="menuitem" (click)="remove(open.id)">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" />
        </svg>
        <span>Delete</span>
      </button>
    </div>
  }
</div>
