<h2 class="visually-hidden">Surfaces</h2>
<div class="fields">
  @if (colouring.active()) {
    <div class="hint">
      <p class="helper">Tap a wall, door, skirting or the ceiling.</p>
      <button type="button" class="done" (click)="endColourMode()">Done</button>
    </div>
  }
  <app-surface-list [items]="items()" [noDoors]="noDoors()" />
  @if (target(); as t) {
    <section class="palette" aria-labelledby="palette-heading" #palette>
      <h3 id="palette-heading">Colour for {{ t.item.name }}</h3>
      <app-swatch-group
        [legend]="'Colour for ' + t.item.name"
        [legendHidden]="true"
        [customLabel]="t.customLabel"
        [presets]="t.presets"
        [value]="t.value"
        [defaultLabel]="t.defaultLabel"
        [deferCustom]="confirmsWalls()"
        (picked)="onPick($event)"
      />
      @if (paintsDoor()) {
        <p class="helper readout">Paints the door and its frame.</p>
      }
      <p class="helper" [class.readout]="customHex()">{{ valueLine() }}</p>
    </section>
  } @else {
    <p class="helper">Select a surface to colour it.</p>
  }
</div>
