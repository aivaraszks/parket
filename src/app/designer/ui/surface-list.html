@for (group of groups(); track group.section) {
  <fieldset>
    <legend>{{ group.legend }}</legend>
    <div class="options">
      @for (item of group.items; track $index) {
        <label class="item">
          <input
            type="radio"
            [name]="groupName(group.section)"
            [checked]="isSelected(item.ref)"
            [attr.aria-describedby]="itemId($index, group.section)"
            (change)="pick(item.ref)"
          />
          <span class="face">
            <span class="dot" [style.--dot]="item.hex" aria-hidden="true"></span>
            {{ item.label }}
            @if (isSelected(item.ref)) {
              <svg class="check" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M3 8.5l3.2 3.2L13 4.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            }
          </span>
        </label>
        <span class="visually-hidden" [id]="itemId($index, group.section)">{{
          colourName(item.hex)
        }}</span>
      }
    </div>
  </fieldset>
}
@if (noDoors()) {
  <p class="note">Doors can be added in a custom room shape.</p>
}
