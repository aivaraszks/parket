<main
  class="stage"
  [attr.inert]="covered() ? '' : null"
  (pointerdown)="onStagePointer()"
  (keydown)="onStagePointer()"
  (keydown.escape)="onEscape($event)"
>
  <h1 class="visually-hidden">Floor designer</h1>
  <app-view-toolbar (projects)="projectsOpen.set(true)" />
  <app-viewport />
  <app-viewport-status />
  <app-colour-hint [available]="scene.status() === 'ready'" />
</main>
<div
  class="chrome"
  #chrome
  [attr.inert]="covered() ? '' : null"
  (keydown.escape)="onEscape($event)"
>
  <app-tray [section]="section()" (closed)="closeSection()" />
  <app-dock [open]="section()" (toggled)="onDockToggle($event)" />
</div>
<router-outlet (activate)="editorOpen.set(true)" (deactivate)="onEditorClosed()" />
<app-editor-loader />
<app-toast-host [attr.inert]="dialogOpen() ? '' : null" />
@if (exporter.fallbackUrl(); as url) {
  <app-image-dialog [url]="url" (closed)="exporter.closeFallback()" />
}
<div class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">
  {{ announcer.message() }}
</div>
@if (confirm.pending(); as request) {
  <app-colour-confirm-dialog
    [body]="request.body"
    (confirmed)="confirm.confirm()"
    (cancelled)="confirm.cancel()"
  />
}
@if (projectsOpen()) {
  <app-projects-dialog (closed)="projectsOpen.set(false)" />
}
@if (shareLink.fallbackUrl(); as url) {
  <app-share-fallback-dialog
    [url]="url"
    [name]="shareLink.projectName()"
    (closed)="shareLink.closeFallback()"
  />
}
@if (sharedPrompt()) {
  <app-shared-link-dialog
    [summary]="sharedSummary()"
    [atLimit]="projects.atLimit()"
    (confirmed)="incoming.accept()"
    (cancelled)="incoming.decline()"
  />
}
